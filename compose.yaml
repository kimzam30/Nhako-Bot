# Nhako bot. Ollama runs natively on Windows (GPU), not in this stack. See docs/REVIVAL_PLAN.md.
#
#   docker compose up -d --build
#   docker compose logs -f
services:
  nhako:
    build: .
    image: nhako:local
    container_name: nhako
    restart: unless-stopped
    env_file: .env
    environment:
      OLLAMA_HOST: http://host.docker.internal:11434
      DOCKER_PROXY_URL: http://nhako-docker-proxy:2375
      # Published ports on the Windows host. kimzamwrld binds 127.0.0.1 only, which
      # host.docker.internal still reaches (same as Ollama).
      MC_SERVERS: getgud=host.docker.internal:25565,kimzamwrld=host.docker.internal:25566
      HF_HOME: /app/data/huggingface   # the root filesystem is read-only
    volumes:
      - ./data:/app/data   # nhako.db, token.json, credentials.json, whisper model cache
    networks: [default, docker-proxy]
    depends_on: [docker-proxy]
    # Hardening: nothing but data/ and /tmp is writable, no Linux capabilities, no setuid.
    read_only: true
    tmpfs: [/tmp:size=64m]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # The WSL VM's 28 GB is budgeted for the game servers (.wslconfig). Measured 2026-10-19:
    # 427 MiB peak RSS with whisper base loaded and transcribing, so 512m leaves ~85 MiB.
    # The high oom_score_adj makes the kernel pick this container before any game server.
    mem_limit: 512m
    oom_score_adj: 800
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # Read-only window onto Docker for /docker and the homelab alerts. An allowlist of exactly
  # the two calls the bot makes: list containers, and one container's stats. Everything else
  # (inspect, logs, file archives, images, any POST) is refused, and only the bot may connect.
  docker-proxy:
    image: wollomatic/socket-proxy:1@sha256:3935b709275e4ec35d6ed5a5c4a1f0d01ed31eec5e7234efc3357ecd47689002
    container_name: nhako-docker-proxy
    restart: unless-stopped
    command:
      - -listenip=0.0.0.0
      - -allowfrom=nhako
      - -allowhealthcheck
      - -shutdowngracetime=5
      - -allowGET=^(/v[0-9.]+)?/containers/(json|[0-9a-f]{12,64}/stats)$$
    # Not root: Docker Desktop's socket is root:root 660, so the group is enough.
    user: "65534:0"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [docker-proxy]
    mem_limit: 64m
    oom_score_adj: 800
    logging: *logging

networks:
  docker-proxy:
    internal: true   # only the bot can talk to the proxy; it has no route out
